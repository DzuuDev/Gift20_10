<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7f2">
  <meta name="description" content="Lời chúc mừng Ngày Phụ nữ Việt Nam 20/10.">
  <title>Chúc mừng ngày 20/10</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbf7f2;
      --rose: #a95665;
      --rose-light: #e9c8c5;
      --ink: #473c3b;
      --muted: #83716d;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: radial-gradient(ellipse at 50% 35%, #fffdf9 0, var(--paper) 64%, #f2e7e1 100%);
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", serif;
    }
    main { position: relative; z-index: 1; display: grid; min-height: 100svh; place-items: center; padding: 48px 20px; }
    .card { display: flex; width: min(100%, 620px); flex-direction: column; align-items: center; text-align: center; }
    .date { margin: 0 0 17px; color: var(--rose); font: 600 11px/1.5 "Segoe UI", Arial, sans-serif; letter-spacing: .19em; text-transform: uppercase; }
    h1 { margin: 0; color: #594345; font-size: clamp(34px, 7vw, 53px); font-weight: 400; line-height: 1.12; letter-spacing: -.035em; }
    h1 span { color: var(--rose); font-style: italic; }
    .intro { margin: 14px 0 0; color: var(--muted); font: 15px/1.6 "Segoe UI", Arial, sans-serif; }
    .envelope-stage { position: relative; display: grid; width: 100%; height: 300px; place-items: center; perspective: 1000px; }
    .envelope {
      position: relative; width: min(82vw, 340px); height: 205px;
      filter: drop-shadow(0 18px 22px #68474a20);
      transition: transform .7s cubic-bezier(.2,.75,.25,1), opacity .5s;
    }
    .envelope.open { transform: translateY(53px) scale(.88); opacity: .18; }
    .back { position: absolute; inset: 0; border-radius: 7px; background: #e6bec0; }
    .side { position: absolute; inset: 0; z-index: 2; background: #efd0cf; clip-path: polygon(0 0, 50% 58%, 0 100%); }
    .side.right { background: #f3d8d4; clip-path: polygon(100% 0, 50% 58%, 100% 100%); }
    .front { position: absolute; inset: 0; z-index: 3; border-radius: 7px; background: linear-gradient(145deg,#f4d5d3,#e9bfc2); clip-path: polygon(0 0,50% 58%,100% 0,100% 100%,0 100%); }
    .flap { position: absolute; inset: 0 0 auto; z-index: 4; height: 61%; background: linear-gradient(145deg,#f8e3dc,#e8bdc0); clip-path: polygon(0 0,100% 0,50% 100%); transform-origin: top; transition: transform .75s ease; }
    .open .flap { z-index: 1; transform: rotateX(180deg); }
    .seal { position: absolute; z-index: 5; top: 49%; left: 50%; display: grid; width: 38px; height: 38px; place-items: center; transform: translate(-50%,-50%); border: 1px solid #ffffff80; border-radius: 50%; color: #fff9f3; background: var(--rose); font: 18px Georgia,serif; box-shadow: 0 3px 9px #75434c35; transition: opacity .2s; }
    .open .seal { opacity: 0; }
    .letter {
      position: absolute; z-index: 2; top: 50%; left: 50%; width: min(84vw, 340px); min-height: 220px;
      padding: 27px 25px; transform: translate(-50%, 28px) scale(.94); visibility: hidden; opacity: 0;
      border: 1px solid #eadfd2; border-radius: 8px; background: #fffdf8;
      box-shadow: 0 14px 34px #5c424017; transition: transform .8s cubic-bezier(.16,1,.3,1), opacity .4s, visibility .4s;
    }
    .open + .letter { visibility: visible; opacity: 1; transform: translate(-50%,-67%) scale(1); transition-delay: .15s; }
    .letter h2 { margin: 0 0 14px; color: var(--rose); font-size: 23px; font-weight: 400; }
    .letter p { margin: 0; color: #554947; font-size: 15px; line-height: 1.8; }
    .actions { display: flex; width: 100%; min-height: 52px; align-items: center; justify-content: center; margin-top: -12px; }
    button { min-height: 46px; border-radius: 999px; cursor: pointer; font: 600 14px "Segoe UI", Arial, sans-serif; transition: transform .2s, background .2s; }
    button:hover { transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid #d5a2a8; outline-offset: 3px; }
    .open-button { min-width: 150px; padding: 0 30px; border: 0; color: white; background: var(--rose); box-shadow: 0 7px 17px #a9566530; }
    .petals { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .petal { position: absolute; top: -24px; width: 9px; height: 13px; border-radius: 80% 15% 80% 20%; background: #d89da2; opacity: 0; animation: drift var(--duration) linear var(--delay) infinite; }
    @keyframes drift { 0% { transform: translate3d(0,-4vh,0) rotate(0); opacity: 0; } 10% { opacity: .38; } 90% { opacity: .3; } 100% { transform: translate3d(var(--sway),108vh,0) rotate(330deg); opacity: 0; } }
    @media (max-width: 520px) {
      main { padding: 46px 17px 34px; }
      .date { letter-spacing: .14em; }
      .intro { max-width: 300px; margin: 13px 0 0; font-size: 14px; }
      .envelope-stage { height: 260px; }
      .envelope { height: 190px; }
      .letter { min-height: 220px; padding: 24px 19px; }
      .letter p { font-size: 14px; }
      .open + .letter { transform: translate(-50%,-65%) scale(1); }
      .actions { margin-top: -8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="petals" id="petals" aria-hidden="true"></div>
  <main>
    <section class="card" aria-label="Thiệp chúc mừng ngày 20 tháng 10">
      <p class="date">20 tháng 10 · Ngày Phụ nữ Việt Nam</p>
      <h1>Chúc mừng<br><span>ngày 20/10</span></h1>
      <p class="intro">Một lời chúc nhỏ nhân ngày Phụ nữ Việt Nam.</p>
      <div class="envelope-stage">
        <div class="envelope" id="envelope" aria-hidden="true">
          <div class="back"></div><div class="flap"></div><div class="side"></div><div class="side right"></div><div class="front"></div><div class="seal">✿</div>
        </div>
        <article class="letter" aria-live="polite">
          <h2>Gửi <span id="recipient">bạn</span>,</h2>
          <p>Chúc bạn có một ngày 20/10 vui vẻ, công việc thuận lợi và nhiều thời gian cho những điều mình yêu thích.</p>
        </article>
      </div>
      <div class="actions"><button class="open-button" id="openButton" type="button" aria-expanded="false">Mở thiệp</button></div>
    </section>
  </main>
  <script>
    const defaultRecipient = 'bạn';
    const recipient = new URLSearchParams(location.search).get('to');
    document.getElementById('recipient').textContent = (recipient || defaultRecipient).trim().slice(0, 45) || defaultRecipient;

    const petals = document.getElementById('petals');
    for (let i = 0; i < 18; i++) {
      const petal = document.createElement('i');
      petal.className = 'petal';
      petal.style.left = `${Math.random() * 100}%`;
      petal.style.setProperty('--duration', `${13 + Math.random() * 12}s`);
      petal.style.setProperty('--delay', `${-Math.random() * 24}s`);
      petal.style.setProperty('--sway', `${Math.random() * 120 - 60}px`);
      petals.appendChild(petal);
    }

    const envelope = document.getElementById('envelope');
    const openButton = document.getElementById('openButton');
    openButton.addEventListener('click', () => {
      const isOpen = envelope.classList.toggle('open');
      openButton.setAttribute('aria-expanded', String(isOpen));
      openButton.textContent = isOpen ? 'Đóng thiệp' : 'Mở thiệp';
    });

  </script>
</body>
</html>
