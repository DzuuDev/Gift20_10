<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7f2">
  <meta name="description" content="Lời chúc mừng Ngày Phụ nữ Việt Nam 20/10.">
  <title>Chúc mừng ngày 20/10</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f3ed;
      --rose: #a95768;
      --rose-light: #e8c9c5;
      --ink: #493d3b;
      --muted: #82716c;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: radial-gradient(ellipse at 50% 27%, #fffefa 0, var(--paper) 58%, #eee2dc 100%);
      font-family: "Baskerville Old Face", "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", serif;
    }
    main { position: relative; z-index: 1; display: grid; min-height: 100svh; place-items: center; padding: 36px 20px; }
    .card { position: relative; display: flex; width: min(100%, 610px); flex-direction: column; align-items: center; padding: 38px 28px 30px; border: 1px solid #ffffffd9; border-radius: 270px 270px 18px 18px; background: linear-gradient(180deg,#fffdfbd9,#fffaf5b8); box-shadow: inset 0 0 0 1px #e8ded5, 0 24px 70px #73514e12; text-align: center; }
    .card::before { position: absolute; inset: 11px; border: 1px solid #d9c7b966; border-radius: 260px 260px 11px 11px; content: ""; pointer-events: none; }
    .date { margin: 0 0 14px; color: var(--rose); font: 600 10px/1.5 "Segoe UI", Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; color: #514143; font-size: clamp(36px, 7vw, 54px); font-weight: 400; line-height: 1.1; letter-spacing: -.035em; }
    h1 span { color: var(--rose); font-style: italic; }
    .intro { margin: 14px 0 0; color: var(--muted); font: 14px/1.65 "Segoe UI", Arial, sans-serif; }
    .envelope-stage { position: relative; display: grid; width: 100%; height: 280px; place-items: center; perspective: 1000px; }
    .envelope {
      position: relative; width: min(78vw, 328px); height: 198px;
      filter: drop-shadow(0 20px 24px #68474a24);
      transition: transform .7s cubic-bezier(.2,.75,.25,1), opacity .5s;
    }
    .envelope.open { transform: translateY(53px) scale(.88); opacity: .18; }
    .back { position: absolute; inset: 0; border-radius: 7px; background: #e6bec0; }
    .side { position: absolute; inset: 0; z-index: 2; background: #efd0cf; clip-path: polygon(0 0, 50% 58%, 0 100%); }
    .side.right { background: #f3d8d4; clip-path: polygon(100% 0, 50% 58%, 100% 100%); }
    .front { position: absolute; inset: 0; z-index: 3; border-radius: 7px; background: linear-gradient(145deg,#f4d5d3,#e9bfc2); clip-path: polygon(0 0,50% 58%,100% 0,100% 100%,0 100%); }
    .flap { position: absolute; inset: 0 0 auto; z-index: 4; height: 61%; background: linear-gradient(145deg,#f8e3dc,#e8bdc0); clip-path: polygon(0 0,100% 0,50% 100%); transform-origin: top; transition: transform .75s ease; }
    .open .flap { z-index: 1; transform: rotateX(180deg); }
    .seal { position: absolute; z-index: 5; top: 49%; left: 50%; display: grid; width: 38px; height: 38px; place-items: center; transform: translate(-50%,-50%); border: 1px solid #ffffff80; border-radius: 50%; color: #fff9f3; background: var(--rose); font: 18px Georgia,serif; box-shadow: 0 3px 9px #75434c35; transition: opacity .2s; }
    .open .seal { opacity: 0; }
    .letter {
      position: absolute; z-index: 2; top: 50%; left: 50%; width: min(84vw, 340px); min-height: 220px;
      padding: 28px 25px; transform: translate(-50%, 28px) scale(.94); visibility: hidden; opacity: 0;
      border: 1px solid #e8d9cc; border-radius: 10px; background: linear-gradient(145deg,#fffefa,#fffaf2);
      box-shadow: 0 16px 42px #5c424021; transition: transform .8s cubic-bezier(.16,1,.3,1), opacity .4s, visibility .4s;
    }
    .open + .letter { visibility: visible; opacity: 1; transform: translate(-50%,-67%) scale(1); transition-delay: .15s; }
    .letter h2 { margin: 0 0 13px; color: var(--rose); font-size: 22px; font-weight: 400; }
    .letter p { margin: 0; color: #554947; font-size: 15px; line-height: 1.75; }
    .actions { display: flex; width: 100%; min-height: 48px; align-items: center; justify-content: center; margin-top: -14px; }
    button { min-height: 46px; border-radius: 999px; cursor: pointer; font: 600 14px "Segoe UI", Arial, sans-serif; transition: transform .2s, background .2s; }
    button:hover { transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid #d5a2a8; outline-offset: 3px; }
    .open-button { min-width: 150px; padding: 0 30px; border: 0; color: white; background: linear-gradient(135deg,#b66673,#98505f); box-shadow: 0 8px 19px #a9566530; }
    .petals { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .petal { position: absolute; top: -24px; width: 8px; height: 12px; border-radius: 80% 15% 80% 20%; background: #cf9298; opacity: 0; animation: drift var(--duration) linear var(--delay) infinite; }
    @keyframes drift { 0% { transform: translate3d(0,-4vh,0) rotate(0); opacity: 0; } 10% { opacity: .38; } 90% { opacity: .3; } 100% { transform: translate3d(var(--sway),108vh,0) rotate(330deg); opacity: 0; } }
    @media (max-width: 520px) {
      main { padding: 24px 13px; }
      .card { padding: 34px 19px 25px; border-radius: 210px 210px 15px 15px; }
      .card::before { inset: 8px; border-radius: 202px 202px 10px 10px; }
      .date { max-width: 240px; margin-bottom: 13px; letter-spacing: .15em; }
      .intro { max-width: 270px; margin-top: 12px; font-size: 13px; }
      .envelope-stage { height: 244px; }
      .envelope { width: min(78vw, 300px); height: 180px; }
      .letter { min-height: 202px; padding: 24px 19px; }
      .letter p { font-size: 14px; line-height: 1.7; }
      .open + .letter { transform: translate(-50%,-65%) scale(1); }
      .actions { margin-top: -10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="petals" id="petals" aria-hidden="true"></div>
  <main>
    <section class="card" aria-label="Thiệp chúc mừng ngày 20 tháng 10">
      <p class="date">Ngày Phụ nữ Việt Nam · 20 tháng 10</p>
      <h1>Chúc mừng<br><span>ngày 20/10</span></h1>
      <p class="intro">Gửi bạn một lời chúc nhỏ cho hôm nay.</p>
      <div class="envelope-stage">
        <div class="envelope" id="envelope" aria-hidden="true">
          <div class="back"></div><div class="flap"></div><div class="side"></div><div class="side right"></div><div class="front"></div><div class="seal">✿</div>
        </div>
        <article class="letter" aria-live="polite">
          <h2>Gửi <span id="recipient">bạn</span>,</h2>
          <p>Chúc bạn 20/10 vui vẻ, mọi việc suôn sẻ và có thêm chút thời gian dành cho riêng mình. Hy vọng tấm thiệp này làm bạn mỉm cười một chút.</p>
        </article>
      </div>
      <div class="actions"><button class="open-button" id="openButton" type="button" aria-expanded="false">Mở thiệp</button></div>
    </section>
  </main>
  <script>
    const defaultRecipient = 'bạn';
    const recipient = new URLSearchParams(location.search).get('to');
    document.getElementById('recipient').textContent = (recipient || defaultRecipient).trim().slice(0, 45) || defaultRecipient;

    const petals = document.getElementById('petals');
    for (let i = 0; i < 18; i++) {
      const petal = document.createElement('i');
      petal.className = 'petal';
      petal.style.left = `${Math.random() * 100}%`;
      petal.style.setProperty('--duration', `${13 + Math.random() * 12}s`);
      petal.style.setProperty('--delay', `${-Math.random() * 24}s`);
      petal.style.setProperty('--sway', `${Math.random() * 120 - 60}px`);
      petals.appendChild(petal);
    }

    const envelope = document.getElementById('envelope');
    const openButton = document.getElementById('openButton');
    openButton.addEventListener('click', () => {
      const isOpen = envelope.classList.toggle('open');
      openButton.setAttribute('aria-expanded', String(isOpen));
      openButton.textContent = isOpen ? 'Đóng thiệp' : 'Mở thiệp';
    });



  </script>
</body>
</html>
